name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-y-logica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build

  punta-a-punta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Recorridos en navegador
        run: |
          PUERTO=8788 BD=:memory: node --no-warnings servidor/node.js &
          sleep 2
          PUNTUAL_URL=http://localhost:8788 python tests/e2e/flujos.py
